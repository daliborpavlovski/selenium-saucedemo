# Application under test
base.url=https://www.saucedemo.com

# Browser (chrome | firefox | edge)
browser=chrome

# Headless mode (true | false)
headless=true

# Implicit wait in seconds
implicit.wait=10

# Explicit wait timeout in seconds
explicit.wait=15

# Test users — credentials are public and intentionally seeded by Sauce Labs
user.standard=standard_user
user.locked=locked_out_user
user.problem=problem_user
user.performance=performance_glitch_user
user.error=error_user
user.visual=visual_user
password=secret_sauce

# Reports output directory
reports.dir=test-output/extent-reports
screenshots.dir=test-output/screenshots
